<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koblenz Survival</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #error-box {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 9999;
      display: none;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="error-box"></div>

  <!-- Fehler-Abfänger für den Browser -->
  <script>
    window.onerror = function (msg, url, line) {
      var box = document.getElementById('error-box');
      box.style.display = 'block';
      box.innerHTML += 'FEHLER: ' + msg + ' (Zeile ' + line + ')<br>';
    };
  </script>

  <!-- Three.js Bibliothek -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Spiel-Module (Reihenfolge ist entscheidend!) -->
  <script src="welt.js?v=200"></script>
  <script src="seilbahn.js?v=200"></script>
  <script src="festung.js?v=200"></script>
  <script src="main.js?v=200"></script>
</body>
</html>
